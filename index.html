<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>かんたん家計簿</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>💰 かんたん家計簿</h1>
  </header>

  <main class="container">
    <!-- サマリー -->
    <section class="summary" aria-label="収支サマリー">
      <div class="summary-card income">
        <span class="summary-label">収入</span>
        <span class="summary-value" id="totalIncome">¥0</span>
      </div>
      <div class="summary-card expense">
        <span class="summary-label">支出</span>
        <span class="summary-value" id="totalExpense">¥0</span>
      </div>
      <div class="summary-card balance">
        <span class="summary-label">残高</span>
        <span class="summary-value" id="balance">¥0</span>
      </div>
    </section>

    <!-- 入力フォーム -->
    <section class="form-section">
      <h2>記録する</h2>
      <form id="entryForm" class="entry-form" autocomplete="off">
        <div class="type-toggle">
          <label class="type-option">
            <input type="radio" name="type" value="expense" checked />
            <span class="type-label expense-label">支出</span>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="income" />
            <span class="type-label income-label">収入</span>
          </label>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="date">日付</label>
            <input type="date" id="date" required />
          </div>
          <div class="field">
            <label for="category">カテゴリ</label>
            <select id="category" required></select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="amount">金額（円）</label>
            <input type="number" id="amount" min="1" step="1" placeholder="1000" required />
          </div>
          <div class="field">
            <label for="memo">メモ（任意）</label>
            <input type="text" id="memo" maxlength="50" placeholder="ランチ代 など" />
          </div>
        </div>

        <button type="submit" class="submit-btn">追加する</button>
      </form>
    </section>

    <!-- 履歴 -->
    <section class="history-section">
      <div class="history-header">
        <h2>履歴</h2>
        <input type="month" id="filterMonth" class="month-filter" aria-label="表示する月" />
      </div>
      <ul id="entryList" class="entry-list"></ul>
      <p id="emptyMessage" class="empty-message">まだ記録がありません。</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
